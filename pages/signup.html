<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - To-Do App</title>
  <link rel="stylesheet" href="../css/signup.css">
</head>
<body>

  <main class="auth-wrap">
    <div class="auth-container">

      <div class="brand">
        <span class="brand-mark" aria-hidden="true">&#10003;</span>
        <span class="brand-name">Tasks</span>
      </div>

      <div class="card">
        <div class="card-head">
          <h1 class="card-title">Create your account</h1>
          <p class="card-subtitle">Start organizing your tasks in minutes</p>
        </div>

        <form id="signup-form">
          <div class="field-row">
            <div class="field">
              <label class="field-label" for="first_name">First Name</label>
              <input class="input" type="text" id="first_name" name="first_name" placeholder="Jane" required>
            </div>
            <div class="field">
              <label class="field-label" for="last_name">Last Name</label>
              <input class="input" type="text" id="last_name" name="last_name" placeholder="Doe" required>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>

          <div class="field">
            <label class="field-label" for="password">Password</label>
            <input class="input" type="password" id="password" name="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
          </div>

          <div class="field">
            <label class="field-label" for="confirm_password">Confirm Password</label>
            <input class="input" type="password" id="confirm_password" name="confirm_password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
          </div>

          <div id="signup-error" class="error-message"></div>

          <button type="submit" id="signup-btn" class="btn btn-primary btn-block">Sign Up</button>
        </form>
      </div>

      <p class="auth-foot">Already have an account? <a class="link" href="signin.html">Sign In</a></p>

    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
