<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - To-Do App</title>
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

  <header class="dashboard-header">
    <div id="user-info"></div>
    <button id="logout-btn">Logout</button>
  </header>

  <main class="dashboard-main">

    <button id="add-task-btn">Add Task</button>

    <section id="active-tasks-section">
      <h2>Active Tasks</h2>
      <div id="active-tasks-list"></div>
    </section>

    <section id="completed-tasks-section">
      <h2>Completed Tasks</h2>
      <div id="completed-tasks-list"></div>
    </section>

  </main>

  <!-- Add/Edit Task Modal (hidden by default) -->
  <div id="task-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">Add Task</h2>

      <form id="task-form">
        <input type="hidden" id="task-item-id">

        <div class="form-group">
          <label for="task-name">Task Name</label>
          <input type="text" id="task-name" name="item_name" required>
        </div>

        <div class="form-group">
          <label for="task-description">Task Description</label>
          <textarea id="task-description" name="item_description" required></textarea>
        </div>

        <div id="task-error" class="error-message"></div>

        <button type="submit" id="task-save-btn">Add</button>
        <button type="button" id="task-cancel-btn">Cancel</button>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
