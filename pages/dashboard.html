<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ToDoBuddy</title>
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

  <header class="dashboard-header">
    <div class="header-left">
      <span class="brand-mark" aria-hidden="true">&#10003;</span>
      <div class="header-titles">
        <span class="brand-name">ToDoBuddy</span>
        <span id="user-info"></span>
      </div>
    </div>
    <button id="logout-btn" class="btn btn-ghost">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Log out
    </button>
  </header>

  <main class="dashboard-main">

    <div class="page-title-row">
      <div>
        <h1>Your tasks</h1>
        <p id="tasks-summary">0 active &middot; 0 completed</p>
      </div>
      <button id="add-task-btn" class="btn btn-primary">+ Add task</button>
    </div>

    <section id="active-tasks-section">
      <div class="section-label">
        <span>Active</span>
        <span id="active-count" class="count-badge">0</span>
      </div>
      <div id="active-tasks-list" class="task-list-box"></div>
    </section>

    <section id="completed-tasks-section">
      <div class="section-label">
        <span>Completed</span>
        <span id="completed-count" class="count-badge">0</span>
      </div>
      <div id="completed-tasks-list" class="task-list-box"></div>
    </section>

  </main>

  <!-- Add/Edit Task Modal (hidden by default) -->
  <div id="task-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">Add Task</h2>

      <form id="task-form">
        <input type="hidden" id="task-item-id">

        <div class="field">
          <label class="field-label" for="task-name">Task Name</label>
          <input class="input" type="text" id="task-name" name="item_name" required>
        </div>

        <div class="field">
          <label class="field-label" for="task-description">Task Description</label>
          <textarea class="input" id="task-description" name="item_description" required></textarea>
        </div>

        <div id="task-error" class="error-message"></div>

        <div class="modal-actions">
          <button type="button" id="task-cancel-btn" class="btn btn-ghost">Cancel</button>
          <button type="submit" id="task-save-btn" class="btn btn-primary">Add</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
