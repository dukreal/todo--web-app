<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ToDoBuddy</title>
  <link rel="stylesheet" href="../css/signin.css">
</head>
<body>

  <main class="auth-wrap">
    <div class="auth-container">

      <div class="brand">
        <span class="brand-mark" aria-hidden="true">&#10003;</span>
        <span class="brand-name">ToDoBuddy</span>
      </div>

      <div class="card">
        <div class="card-head">
          <h1 class="card-title">Welcome back</h1>
          <p class="card-subtitle">Sign in to manage your tasks</p>
        </div>

        <form id="signin-form">
          <div class="field">
            <label class="field-label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>

          <div class="field">
            <label class="field-label" for="password">Password</label>
            <input class="input" type="password" id="password" name="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
          </div>

          <div id="signin-error" class="error-message"></div>

          <button type="submit" id="signin-btn" class="btn btn-primary btn-block">Sign In</button>
        </form>
      </div>

      <p class="auth-foot">Don't have an account? <a class="link" href="signup.html">Sign Up</a></p>

    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
